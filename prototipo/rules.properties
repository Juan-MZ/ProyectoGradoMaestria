# ============================================================================
#  Catalogo de reglas del mecanismo de deteccion de deriva arquitectonica
#  ---------------------------------------------------------------------
#  Todo el conocimiento sobre que es admisible en el sistema analizado vive en
#  este archivo: el motor no contiene ninguna regla codificada. Cambiar de
#  proyecto exige cambiar esta configuracion, no recompilar el mecanismo.
# ============================================================================

# --- Alcance del analisis ---------------------------------------------------
# Paquete raiz del sistema bajo analisis. Las dependencias hacia paquetes que no
# cuelguen de esta raiz (JDK, bibliotecas de terceros) quedan fuera del grafo.
raiz=com.caso

# --- Capas arquitectonicas --------------------------------------------------
# Cada capa lista los prefijos de paquete que la componen. Un paquete pertenece
# a una capa si su nombre comienza por alguno de esos prefijos, de modo que los
# subpaquetes heredan la capa de su padre.
capas=presentacion,negocio,persistencia
capa.presentacion=com.caso.presentacion
capa.negocio=com.caso.negocio
capa.persistencia=com.caso.persistencia

# --- Matriz de dependencias permitidas --------------------------------------
# Formato: permitido.<capa origen>=<capa destino>,<capa destino>,...
# Una capa con la lista vacia no puede depender de ninguna otra capa declarada.
# Los paquetes no asignados a ninguna capa (por ejemplo, el dominio compartido)
# quedan deliberadamente fuera de esta regla: al no pertenecer a la
# estratificacion, no puede afirmarse que la vulneren.
permitido.presentacion=negocio
permitido.negocio=persistencia
permitido.persistencia=

# --- Exenciones -------------------------------------------------------------
# Un catalogo que no admita excepciones obliga a elegir entre tolerar falsos
# positivos o apagar la regla entera. Se distinguen dos situaciones, y ambas se
# enumeran en el reporte para que la excepcion quede registrada y sea auditable.
#
# excluir: codigo que NO forma parte del sistema evaluado aunque el empaquetado
#   lo situe bajo la misma raiz (dependencias vendorizadas, codigo generado).
#   Se aplica al paquete y a TODOS sus subpaquetes, y lo saca del grafo.
#   Ejemplo: excluir=com.caso.generado,com.caso.vendor
excluir=
#
# rol.compartido: paquetes que SI forman parte del sistema pero cuyo papel
#   ---nucleo de anotaciones, raiz de composicion, fachada--- hace que
#   concentren dependencias por diseno. Quedan exentos de las reglas de ciclos y
#   de concentracion, pero siguen en el grafo y en la evidencia.
#   La coincidencia es EXACTA y no se hereda a los subpaquetes: un papel lo
#   desempena un paquete concreto, y propagarlo hacia abajo eximiria al sistema
#   entero cuando el nucleo compartido resulta ser la raiz.
rol.compartido=

# --- Umbral de concentracion ------------------------------------------------
# Acoplamiento eferente (Ce) maximo admisible por paquete. Un paquete cuyo Ce
# supere este valor se reporta como candidato a "componente dios".
umbral.concentracion=3

# --- Umbrales de la Tasa de Conformidad -------------------------------------
# CR >= umbral.cr.aceptable      -> Aceptable
# umbral.cr.observacion <= CR    -> En observacion
# CR < umbral.cr.observacion     -> No conforme
umbral.cr.aceptable=85
umbral.cr.observacion=70

# --- Modo de clasificacion --------------------------------------------------
# cr            : el estado depende unicamente de la Tasa de Conformidad.
# cr+severidad  : el estado adopta el mas restrictivo entre el que dicta la CR
#                 (extension del incumplimiento) y el que dicta la severidad del
#                 peor hallazgo (gravedad). Evita que una violacion aislada pero
#                 severa quede diluida por el tamano del sistema.
clasificacion.modo=cr+severidad
