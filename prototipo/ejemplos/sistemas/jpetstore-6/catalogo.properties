# ============================================================================
# Catalogo de reglas de MyBatis JPetStore 6 (commit c9a37f2, 2026-10-17)
# Transcribe la arquitectura que documenta el propio proyecto
# (src/site/xdoc/index.xml): "a typical MVC application with three layers:
# presentation, logic and data access"; la logica la forman servicios y
# objetos de dominio. No lo propuso el asistente.
# ============================================================================

raiz=org.mybatis.jpetstore

capas=presentacion,servicio,persistencia,dominio
# presentacion: controladores Spring MVC y su configuracion web.
capa.presentacion=org.mybatis.jpetstore.web
# servicio: servicios transaccionales (capa de logica).
capa.servicio=org.mybatis.jpetstore.service
# persistencia: mappers de MyBatis (capa de acceso a datos).
capa.persistencia=org.mybatis.jpetstore.mapper
# dominio: objetos de dominio, que el documento ubica en la capa de logica y
# que todas las capas intercambian.
capa.dominio=org.mybatis.jpetstore.domain

permitido.presentacion=servicio,dominio
permitido.servicio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral: percentil 90 del Ce de los paquetes no exentos de esta version, el
# procedimiento fijado con el conjunto de calibracion (ejemplos/estudios/umbral.md).
# Congela la distribucion aceptada y senala lo que la exceda.
umbral.concentracion=2
umbral.cr.aceptable=85
umbral.cr.observacion=70
clasificacion.modo=cr+severidad
