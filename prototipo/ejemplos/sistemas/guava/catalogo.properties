# ============================================================================
# Catalogo de reglas de Guava 33.2.1
# Propuesto con el asistente de Arquitecta (deepseek-v4-pro) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.google

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=eventbus,net,reflect,io,cache,graph,hash,html,xml,concurrente,colecciones,matematicas,primitivas,escape,nucleo
# eventbus: Bus de eventos; consume cache, reflect, concurrente y utilidades
# base.
capa.eventbus=com.google.common.eventbus
# net: Utilidades de red e identificadores; integra io, hash, escape y
# utilidades base.
capa.net=com.google.common.net
# reflect: Introspección y ClassPath; se apoya en io y colecciones.
capa.reflect=com.google.common.reflect
# io: Entrada/salida; integra graph, hash y utilidades básicas.
capa.io=com.google.common.io
# cache: Cachés; se apoya en concurrencia y colecciones.
capa.cache=com.google.common.cache
# graph: Modelos de grafos; construidos sobre colecciones y base.
capa.graph=com.google.common.graph
# hash: Hashing y filtros Bloom; usa base y matemáticas.
capa.hash=com.google.common.hash
# html: Escapado específico de HTML; usa escape.
capa.html=com.google.common.html
# xml: Escapado específico de XML; usa escape.
capa.xml=com.google.common.xml
# concurrente: Utilidades de concurrencia; se apoya en colecciones y base.
capa.concurrente=com.google.common.util.concurrent
# colecciones: Estructuras de colecciones; utiliza base, primitivas y
# matemáticas.
capa.colecciones=com.google.common.collect
# matematicas: Aritmética y utilidades matemáticas; usa primitivas y base.
capa.matematicas=com.google.common.math
# primitivas: Utilidades de tipos primitivos; dependen de base.
capa.primitivas=com.google.common.primitives
# escape: Escapado genérico de texto; funcionalidad baja sobre base.
capa.escape=com.google.common.escape
# nucleo: Base compartida de utilidades y subpaquetes internos; no depende de
# otras capas.
capa.nucleo=com.google.common.base

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.eventbus=nucleo,cache,colecciones,primitivas,reflect,concurrente
permitido.net=nucleo,colecciones,escape,hash,io,primitivas
permitido.reflect=nucleo,colecciones,io,primitivas
permitido.io=nucleo,colecciones,graph,hash,matematicas,primitivas
permitido.cache=nucleo,colecciones,matematicas,primitivas,concurrente
permitido.graph=nucleo,colecciones,matematicas,primitivas
permitido.hash=nucleo,matematicas,primitivas
permitido.html=escape
permitido.xml=escape
permitido.concurrente=nucleo,colecciones,matematicas,primitivas
permitido.colecciones=nucleo,matematicas,primitivas
permitido.matematicas=nucleo,primitivas
permitido.primitivas=nucleo
permitido.escape=nucleo
permitido.nucleo=

# Umbral de concentracion: Tras excluir anotaciones externas y Public Suffix,
# los módulos sanos no superan Ce=7; 8 señala concentraciones superiores a ese
# techo.
umbral.concentracion=8

# Codigo que no forma parte del sistema evaluado (sale del analisis):
#   com.google.errorprone.annotations: Anotaciones de Error Prone, dependencia
#     externa de compile-time; no son código del sistema.
#   com.google.j2objc.annotations: Anotaciones de J2ObjC, dependencia externa;
#     no son código del sistema.
#   com.google.thirdparty.publicsuffix: Implementación generada del sufijo
#     público; código generado, no mantenido manualmente.
excluir=com.google.errorprone.annotations,com.google.j2objc.annotations,com.google.thirdparty.publicsuffix

clasificacion.modo=cr+severidad
