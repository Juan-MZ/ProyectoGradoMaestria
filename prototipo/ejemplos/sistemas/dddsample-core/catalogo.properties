# ============================================================================
# Catalogo de reglas de DDD Sample (Citerus, commit d8b8962, 2025-06-02)
# Transcribe la arquitectura en capas de Evans (2003, cap. 4) que el proyecto
# documenta en sus package.html: interfaces de usuario -> aplicacion ->
# dominio, con la infraestructura implementando las abstracciones del dominio
# (repositorios, servicios). No lo propuso el asistente.
# ============================================================================

raiz=se.citerus.dddsample

capas=interfaces,aplicacion,dominio,infraestructura
# interfaces: controladores web, fachadas remotas, servicios web y DTO.
capa.interfaces=se.citerus.dddsample.interfaces
# aplicacion: servicios de aplicacion que coordinan el dominio.
capa.aplicacion=se.citerus.dddsample.application
# dominio: modelo (cargo, handling, location, voyage), servicios y soporte.
capa.dominio=se.citerus.dddsample.domain
# infraestructura: persistencia, mensajeria, enrutamiento y datos de ejemplo.
capa.infraestructura=se.citerus.dddsample.infrastructure

permitido.interfaces=aplicacion,dominio
permitido.aplicacion=dominio
permitido.dominio=
permitido.infraestructura=dominio

# Raiz de composicion: Application y config ensamblan todas las capas.
rol.compartido=se.citerus.dddsample,se.citerus.dddsample.config

# Umbral: percentil 90 del Ce de los paquetes no exentos de esta version, el
# procedimiento fijado con el conjunto de calibracion (ejemplos/estudios/umbral.md).
# Congela la distribucion aceptada y senala lo que la exceda.
umbral.concentracion=6
umbral.cr.aceptable=85
umbral.cr.observacion=70
clasificacion.modo=cr+severidad
