# ============================================================================
# Catalogo de reglas de Apache Commons Lang 3.14.0
# Propuesto con el asistente de Arquitecta (deepseek-v4-pro) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=org.apache.commons.lang3

# Umbral de concentracion: Los paquetes de utilidades sanos tienen Ce entre 0
# y 5; un Ce superior a 5 sugiere concentración indebida de dependencias
# salientes.
umbral.concentracion=5

# Paquetes que concentran dependencias por su papel (exentos de ciclos y
# concentracion):
#   org.apache.commons.lang3: Paquete raíz/API que por diseño agrega a los
#     subpaquetes y concentra Ce=10; es el núcleo compartido de la biblioteca.
rol.compartido=org.apache.commons.lang3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - Ciclo entre org.apache.commons.lang3.builder,
#     org.apache.commons.lang3.function, org.apache.commons.lang3.exception,
#     org.apache.commons.lang3.tuple, org.apache.commons.lang3.stream y
#     org.apache.commons.lang3.reflect: dependencias mutuas forman un
#     componente fuertemente conexo.

clasificacion.modo=cr+severidad
