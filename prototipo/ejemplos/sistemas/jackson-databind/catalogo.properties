# ============================================================================
# Catalogo de reglas de Jackson Databind 2.17.2
# Propuesto con el asistente de Arquitecta (deepseek-v4-pro) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.fasterxml.jackson.databind

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=serializacion,deserializacion,introspeccion,tipos
# serializacion: Motor de serialización y sus implementaciones, expuesto como
# un subsistema cohesivo.
capa.serializacion=com.fasterxml.jackson.databind.ser.impl,com.fasterxml.jackson.databind.ser.std,com.fasterxml.jackson.databind.ser
# deserializacion: Motor de deserialización y sus implementaciones, simétrico
# a serialización.
capa.deserializacion=com.fasterxml.jackson.databind.deser.impl,com.fasterxml.jackson.databind.deser.std,com.fasterxml.jackson.databind.deser
# introspeccion: Introspección de clases y soporte de versiones JDK.
capa.introspeccion=com.fasterxml.jackson.databind.introspect,com.fasterxml.jackson.databind.jdk14
# tipos: Modelo de tipos Java usado por los motores.
capa.tipos=com.fasterxml.jackson.databind.type

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.serializacion=introspeccion,tipos
permitido.deserializacion=introspeccion,tipos
permitido.introspeccion=tipos
permitido.tipos=

# Umbral de concentracion: La mayoría de paquetes funcionales tiene Ce entre 0
# y 11; 12 separa los tres hubs raíz/deser/ser.
umbral.concentracion=12

# Paquetes que concentran dependencias por su papel (exentos de ciclos y
# concentracion):
#   com.fasterxml.jackson.databind: Fachada pública y núcleo de API
#     (ObjectMapper, DatabindContext) que concentra dependencias hacia todos
#     los subsistemas.
rol.compartido=com.fasterxml.jackson.databind

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.fasterxml.jackson.databind.introspect ->
#     com.fasterxml.jackson.databind.ser: la introspección se acopla a la
#     serialización, invirtiendo la dependencia prevista.
#   - com.fasterxml.jackson.databind.cfg ->
#     com.fasterxml.jackson.databind.deser y
#     com.fasterxml.jackson.databind.ser: la configuración se acopla a los
#     motores, lo que sugiere un núcleo transversal no estratificado.
#   - com.fasterxml.jackson.databind.annotation ->
#     com.fasterxml.jackson.databind.deser y
#     com.fasterxml.jackson.databind.ser: las anotaciones dependen de los
#     motores que configuran.
#   - com.fasterxml.jackson.databind.util ->
#     com.fasterxml.jackson.databind.cfg, .introspect y .jsontype: utilidades
#     con dependencias a paquetes de núcleo, probable ciclo util-núcleo.
#   - Ciclos com.fasterxml.jackson.databind.ser <->
#     com.fasterxml.jackson.databind.ser.impl y
#     com.fasterxml.jackson.databind.deser <->
#     com.fasterxml.jackson.databind.deser.impl: motor e implementación forman
#     componentes fuertemente conexos.

clasificacion.modo=cr+severidad
