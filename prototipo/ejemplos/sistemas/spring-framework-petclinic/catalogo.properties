# ============================================================================
# Catalogo de reglas de Spring Framework PetClinic (commit cf39292, 2026-10-05)
# Transcribe la arquitectura que documenta el propio proyecto (readme.md):
# "a 3-layer architecture (presentation --> service --> repository)", con el
# modelo de dominio compartido por las tres capas. No lo propuso el asistente.
# ============================================================================

raiz=org.springframework.samples.petclinic

capas=web,servicio,repositorio,modelo
# web: controladores Spring MVC y formateadores (capa de presentacion).
capa.web=org.springframework.samples.petclinic.web
# servicio: fachada transaccional ClinicService.
capa.servicio=org.springframework.samples.petclinic.service
# repositorio: interfaces y sus tres implementaciones (JDBC, JPA, Spring Data).
capa.repositorio=org.springframework.samples.petclinic.repository
# modelo: entidades del dominio, que las tres capas comparten.
capa.modelo=org.springframework.samples.petclinic.model

permitido.web=servicio,modelo
permitido.servicio=repositorio,modelo
permitido.repositorio=modelo
permitido.modelo=

# util (EntityUtils, CallMonitoringAspect) es soporte transversal: se deja sin
# capa, fuera de FF1, y sigue sujeto a FF2 y FF3.

# El paquete raiz solo contiene PetclinicInitializer, la raiz de composicion
# que configura el contenedor: depende de todo por su papel.
rol.compartido=org.springframework.samples.petclinic

# Umbral: percentil 90 del Ce de los paquetes no exentos de esta version, el
# procedimiento fijado con el conjunto de calibracion (ejemplos/estudios/umbral.md).
# Congela la distribucion aceptada y senala lo que la exceda.
umbral.concentracion=3
umbral.cr.aceptable=85
umbral.cr.observacion=70
clasificacion.modo=cr+severidad
