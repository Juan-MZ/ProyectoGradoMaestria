# ============================================================================
#  Aplicacion de Arquitecta sobre ArchUnit 1.3.0 (seccion 4.6 de la monografia)
#  -------------------------------------------------------------------------
#  IMPORTANTE: la estratificacion declarada es una HIPOTESIS propia sobre la
#  arquitectura de ArchUnit, deducida de los nombres de sus modulos. No es una
#  arquitectura que el proyecto declare: cualquier desviacion reportada lo es
#  respecto de esta suposicion, no necesariamente un defecto de ArchUnit.
#
#  Esta es la configuracion CON exenciones. La variante sin ellas esta en
#  rules-archunit-sin-exenciones.properties.
# ============================================================================

raiz=com.tngtech.archunit

capas=base,core,lang,library
capa.base=com.tngtech.archunit.base
capa.core=com.tngtech.archunit.core
capa.lang=com.tngtech.archunit.lang
capa.library=com.tngtech.archunit.library

permitido.base=
permitido.core=base
permitido.lang=core,base
permitido.library=lang,core,base

# ArchUnit empaqueta Guava y ASM bajo su propio prefijo. No son codigo suyo y no
# deben pesar en el diagnostico de su arquitectura.
excluir=com.tngtech.archunit.thirdparty

# El paquete raiz aloja las anotaciones @PublicAPI e @Internal, a las que todo
# el sistema referencia: actua como nucleo compartido, no como una capa.
rol.compartido=com.tngtech.archunit

umbral.concentracion=6
umbral.cr.aceptable=85
umbral.cr.observacion=70
clasificacion.modo=cr+severidad
