# ============================================================================
# Catalogo de reglas de c3-concentracion
# Propuesto con el asistente de Arquitecta (deepseek-v4-pro) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Interfaz de usuario: expone casos de uso y no debe acceder
# directamente a dominio ni a persistencia.
capa.presentacion=com.caso.presentacion
# negocio: Capa de lógica de negocio: coordina persistencia y dominio, sin
# depender de presentación.
capa.negocio=com.caso.negocio
# persistencia: Acceso a datos: depende solo del dominio, no de negocio ni de
# presentación.
capa.persistencia=com.caso.persistencia
# dominio: Núcleo del modelo: no depende de ninguna otra capa.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: El Ce de los paquetes está entre 0 y 2, salvo util
# con Ce=4; el umbral 3 aísla el paquete concentrador sin marcar al resto.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.presentacion -> com.caso.dominio: la presentación salta la capa
#     de negocio para usar el modelo directamente.
#   - com.caso.util -> com.caso.presentacion: un paquete de utilidades no
#     debería depender de la interfaz de usuario.
#   - com.caso.util -> com.caso.negocio: dependencia desde utilidades hacia
#     lógica de negocio acopla soporte transversal a reglas de negocio.
#   - com.caso.util -> com.caso.persistencia: dependencia desde utilidades
#     hacia acceso a datos es una inversión de la estratificación.

clasificacion.modo=cr+severidad
