# ============================================================================
# Catalogo de reglas de c3-concentracion
# Propuesto con el asistente de Arquitecta (deepseek-v4-pro) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Controladores e interfaz de usuario; depende de negocio y del
# dominio compartido.
capa.presentacion=com.caso.presentacion
# negocio: Servicios de aplicación y reglas de negocio; orquesta persistencia
# y dominio.
capa.negocio=com.caso.negocio
# persistencia: Repositorios y acceso a datos; depende del dominio.
capa.persistencia=com.caso.persistencia
# dominio: Entidades y lógica de dominio; capa inferior sin dependencias
# salientes.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: La mayoría de paquetes tiene Ce 2; com.caso.util
# con Ce=4 queda como valor atípico y debe revisarse.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.util -> com.caso.dominio: una utilidad no debería depender del
#     dominio; debería ser dependida por las capas.
#   - com.caso.util -> com.caso.negocio: dependencia de util a negocio
#     invierte la dirección esperada.
#   - com.caso.util -> com.caso.persistencia: dependencia de util a
#     persistencia sugiere acoplamiento indebido.
#   - com.caso.util -> com.caso.presentacion: dependencia de util a
#     presentación es la más anómala para una utilidad.

clasificacion.modo=cr+severidad
