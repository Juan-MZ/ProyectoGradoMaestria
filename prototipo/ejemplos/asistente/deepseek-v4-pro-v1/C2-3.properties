# ============================================================================
# Catalogo de reglas de c2-ciclo
# Propuesto con el asistente de Arquitecta (deepseek-v4-pro) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia
# presentacion: ControladorVenta es el punto de entrada y solo debe depender
# de la capa de negocio.
capa.presentacion=com.caso.presentacion
# negocio: Agrupa ServicioVenta y, por herencia de prefijo, también a
# CalculadoraTotales; orquesta reglas de negocio y usa persistencia.
capa.negocio=com.caso.negocio
# persistencia: RepositorioVenta es la capa de acceso a datos y solo depende
# de las entidades de dominio.
capa.persistencia=com.caso.persistencia

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=persistencia
permitido.persistencia=

# Umbral de concentracion: El Ce máximo observado es 3 (com.caso.negocio); el
# umbral 4 tolera una colaboración adicional sin señalar concentraciones
# anómalas.
umbral.concentracion=4

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.negocio <-> com.caso.negocio.calculo: dependencia mutua entre
#     ServicioVenta y CalculadoraTotales; forma un ciclo que FF2 detectará y
#     conviene romper invirtiendo la dependencia o extrayendo la lógica
#     compartida.

clasificacion.modo=cr+severidad
