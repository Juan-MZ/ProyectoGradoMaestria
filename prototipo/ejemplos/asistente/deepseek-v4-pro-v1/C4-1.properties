# ============================================================================
# Catalogo de reglas de c4-combinado
# Propuesto con el asistente de Arquitecta (deepseek-v4-pro) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio,utilidades
# presentacion: Interfaz de usuario y controladores; solo debe invocar a
# negocio y utilidades.
capa.presentacion=com.caso.presentacion
# negocio: Lógica de aplicación; depende de persistencia, dominio y
# utilidades.
capa.negocio=com.caso.negocio
# persistencia: Acceso a datos; debe depender de dominio y utilidades, no de
# capas superiores.
capa.persistencia=com.caso.persistencia
# dominio: Entidades de negocio; sin dependencias salientes salvo utilidades
# compartidas.
capa.dominio=com.caso.dominio
# utilidades: Utilidades transversales; no debe depender de capas superiores.
capa.utilidades=com.caso.util

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,utilidades
permitido.negocio=persistencia,dominio,utilidades
permitido.persistencia=dominio,utilidades
permitido.dominio=utilidades
permitido.utilidades=

# Umbral de concentracion: Ce máximo observado es 4 en com.caso.util; el resto
# no supera 3, por lo que el umbral 3 aísla el paquete concentrador.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.util -> com.caso.dominio: utilidades depende del dominio;
#     debería ser al revés.
#   - com.caso.util -> com.caso.negocio: utilidades depende de negocio;
#     inversión de dependencia.
#   - com.caso.util -> com.caso.persistencia: utilidades depende de
#     persistencia; inversión de dependencia.
#   - com.caso.util -> com.caso.presentacion: utilidades depende de
#     presentación; inversión de dependencia.
#   - com.caso.persistencia -> com.caso.presentacion: persistencia depende de
#     presentación; salto e inversión de capa.
#   - com.caso.persistencia -> com.caso.negocio: persistencia depende de
#     negocio; ciclo con negocio.
#   - com.caso.presentacion -> com.caso.dominio: presentación accede
#     directamente al dominio; salto de capa si se confirma la arquitectura
#     estricta.

clasificacion.modo=cr+severidad
