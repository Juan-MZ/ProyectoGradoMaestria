# ============================================================================
# Catalogo de reglas de c3-concentracion
# Propuesto con el asistente de Arquitecta (deepseek-v4-pro) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Capa de interfaz y entrega; orquesta los casos de uso.
capa.presentacion=com.caso.presentacion
# negocio: Capa de lógica de aplicación y casos de uso.
capa.negocio=com.caso.negocio
# persistencia: Capa de acceso a datos; implementa repositorios.
capa.persistencia=com.caso.persistencia
# dominio: Capa de modelo de negocio; no depende de otras capas.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: La mayoría de paquetes tiene Ce <= 2; util con Ce=4
# concentra dependencias hacia todas las capas y duplica ese nivel.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.presentacion -> com.caso.dominio: acceso directo de
#     presentación al modelo, saltando negocio.
#   - com.caso.util -> com.caso.presentacion: utilidades acopladas a la capa
#     de presentación.
#   - com.caso.util -> com.caso.negocio: utilidades acopladas a la lógica de
#     negocio.
#   - com.caso.util -> com.caso.persistencia: utilidades acopladas al acceso a
#     datos.
#   - com.caso.util -> com.caso.dominio: utilidades acopladas al modelo; Ce=4
#     sugiere responsabilidades mal ubicadas.

clasificacion.modo=cr+severidad
