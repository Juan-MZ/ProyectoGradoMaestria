# ============================================================================
# Catalogo de reglas de c3-concentracion
# Propuesto con el asistente de Arquitecta (qwen2.5-14b-gpu) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Interfaz de usuario a nivel de negocio.
capa.presentacion=com.caso.presentacion
# negocio: Lógica de negocio, reglas de negocio.
capa.negocio=com.caso.negocio
# persistencia: Interfaz de datos con el sistema de gestión de bases de datos.
capa.persistencia=com.caso.persistencia
# dominio: Modelo de datos de la aplicación, entidades.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: El paquete util tiene dependencias elevadas pero
# justificadas por su rol de utilidades generales acopladas a través de la
# aplicación.
umbral.concentracion=4

# Paquetes que concentran dependencias por su papel (exentos de ciclos y
# concentracion):
#   com.caso.util: Paquete de utilidades que interactúa con todos los otros
#     niveles.
rol.compartido=com.caso.util

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.util -> *: Paquete de utilidades interactuando con todas las
#     capas, potencial fuente de problemas de concentración.

clasificacion.modo=cr+severidad
