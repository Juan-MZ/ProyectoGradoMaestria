# ============================================================================
# Catalogo de reglas de c3-concentracion
# Propuesto con el asistente de Arquitecta (qwen2.5-14b-cpu) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio,compartido
# presentacion: Controla la interacción principal del usuario con el sistema.
capa.presentacion=com.caso.presentacion
# negocio: Contiene el corazón logico de la aplicación.
capa.negocio=com.caso.negocio
# persistencia: Gestiona la persistencia y acceso a la base de datos.
capa.persistencia=com.caso.persistencia
# dominio: Representa el modelo de dominio del negocio.
capa.dominio=com.caso.dominio
# compartido: Funciones generales de utilidad no específica a ninguna capa,
# que concentra dependencias por su esencia transversal al sistema.
capa.compartido=com.caso.util

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=dominio,persistencia
permitido.persistencia=dominio
permitido.dominio=compartido
permitido.compartido=presentacion,negocio,persistencia,dominio

# Umbral de concentracion: El paquete util concentra 4 dependencias salientes,
# que lo aproxican al umbral superior (10), pero su rol transversal justifica
# un umbral más exigente.
umbral.concentracion=5

# Paquetes que concentran dependencias por su papel (exentos de ciclos y
# concentracion):
#   com.caso.util: Las dependencias entrantes y salientes de este paquete no
#     siguen la estratificación definida y están dispersas en varias áreas del
#     sistema.
rol.compartido=com.caso.util

clasificacion.modo=cr+severidad
