# ============================================================================
# Catalogo de reglas de c3-concentracion
# Propuesto con el asistente de Arquitecta (qwen2.5-14b-cpu) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,utilidades
# presentacion: Encapsula la lógica de la interfaz de usuario.
capa.presentacion=com.caso.presentacion
# negocio: Mete la lógica crucial del negocio, dependiendo de dominio y
# persistencia.
capa.negocio=com.caso.negocio
# persistencia: Gestiona la conexión con la base de datos y depende solo de
# dominio.
capa.persistencia=com.caso.persistencia
# utilidades: Paquete con utilidades que benefician a todas las otras capas.
capa.utilidades=com.caso.util

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,utilidades
permitido.negocio=dominio
permitido.persistencia=dominio
permitido.utilidades=

# Umbral de concentracion: com.caso.util es un paquete con alto Ce por su
# papel de utilidad compartida.
umbral.concentracion=6

# Paquetes que concentran dependencias por su papel (exentos de ciclos y
# concentracion):
#   com.caso.dominio: Dominio central para todas las capas
#   com.caso.util: Utilidades compartidas para todas las capas
rol.compartido=com.caso.dominio,com.caso.util

clasificacion.modo=cr+severidad
