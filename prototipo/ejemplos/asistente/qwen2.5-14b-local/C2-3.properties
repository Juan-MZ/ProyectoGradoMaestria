# ============================================================================
# Catalogo de reglas de c2-ciclo
# Propuesto con el asistente de Arquitecta (qwen2.5-14b-cpu) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,negocio-calculo,persistencia,dominio
# presentacion: Interfaz de usuario al negocio
capa.presentacion=com.caso.presentacion
# negocio: Lógica empresarial principal
capa.negocio=com.caso.negocio
# negocio-calculo: Calculadora que pertenece a lógica de negocio
capa.negocio-calculo=com.caso.negocio.calculo
# persistencia: Persistencia de datos del negocio
capa.persistencia=com.caso.persistencia
# dominio: Entidades del dominio compartidas
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=negocio-calculo,persistencia,dominio
permitido.negocio-calculo=negocio,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: Concentración de dependencias en dominio está
# justificada por su papel central
umbral.concentracion=5

# Paquetes que concentran dependencias por su papel (exentos de ciclos y
# concentracion):
#   com.caso.dominio: Unidad de dominio central usada por toda la aplicación
rol.compartido=com.caso.dominio

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.dominio -> com.caso.presentacion: Concentración de dependencias
#     podría indicar problemas de diseño

clasificacion.modo=cr+severidad
