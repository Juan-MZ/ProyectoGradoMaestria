# ============================================================================
# Catalogo de reglas de c4-combinado
# Propuesto con el asistente de Arquitecta (qwen2.5-14b-cpu) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio,utilidades
# presentacion: Intera con el negocio y el dominio.
capa.presentacion=com.caso.presentacion
# negocio: Depende del dominio para los modelos y de la persistencia para el
# almacén de datos.
capa.negocio=com.caso.negocio
# persistencia: Se relaciona con el negocio y la presentación.
capa.persistencia=com.caso.persistencia
# dominio: Es compartido por diferentes capas debido a su definición de
# dominio.
capa.dominio=com.caso.dominio
# utilidades: Paquete con funcionalidades comunes y alto acoplamiento eferente
# con otras capas.
capa.utilidades=com.caso.util

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=dominio,persistencia
permitido.persistencia=negocio
permitido.dominio=
permitido.utilidades=

# Umbral de concentracion: El paquete util tiene un alto Ce, así que
# justificar las exenciones en utilidades, caso por caso.
umbral.concentracion=5

# Paquetes que concentran dependencias por su papel (exentos de ciclos y
# concentracion):
#   com.caso.util: Utilidades necesarias por múltiples capas y responsabilidad
#     única.
rol.compartido=com.caso.util

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.util -> *: Alta dependencia eferente de utilidades con otras
#     capas; debe revisarse su necesidad.
#   - com.caso.persistencia -> com.caso.dominio: Dependencia inusual; debería
#     revisarse su propósito.

clasificacion.modo=cr+severidad
