# ============================================================================
# Catalogo de reglas de c1-capas
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia
# presentacion: Punto de entrada que atiende la interfaz y delega en el
# servicio de negocio.
capa.presentacion=com.caso.presentacion
# negocio: Capa de casos de uso que orquesta entidades y repositorios.
capa.negocio=com.caso.negocio
# persistencia: Capa de acceso a datos, base de la estratificación.
capa.persistencia=com.caso.persistencia

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=persistencia
permitido.persistencia=

# Umbral de concentracion: Los paquetes que cooperan por diseño no superan
# Ce=2 (negocio); se fija 2 para que cualquier paquete con más dependencias
# salientes de las previstas quede señalado.
umbral.concentracion=2

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.presentacion -> com.caso.persistencia: el controlador accede al
#     repositorio saltándose negocio, lo que duplica la lógica de acceso y
#     acopla la interfaz al esquema de datos.
#   - com.caso.presentacion -> com.caso.dominio: tolerado por ser núcleo
#     compartido, pero conviene confirmar si el controlador debe manipular
#     entidades o solo DTOs de negocio.

clasificacion.modo=cr+severidad
