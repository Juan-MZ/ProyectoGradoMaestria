# ============================================================================
# Catalogo de reglas de c3-concentracion
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio,util
# presentacion: Punto de entrada de la aplicación; solo debe orquestar negocio
# y modelos de dominio.
capa.presentacion=com.caso.presentacion
# negocio: Servicios de caso de uso que coordinan persistencia y entidades.
capa.negocio=com.caso.negocio
# persistencia: Acceso a datos; puede conocer el dominio pero no capas
# superiores.
capa.persistencia=com.caso.persistencia
# dominio: Núcleo de entidades compartido por todas las capas; no depende de
# ninguna.
capa.dominio=com.caso.dominio
# util: Utilidades transversales, que por su papel no deben depender de
# ninguna capa de la aplicación.
capa.util=com.caso.util

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=
permitido.util=

# Umbral de concentracion: Los paquetes con acoplamiento eferente sano tienen
# Ce entre 0 y 2 (dominio 0, persistencia 1, negocio y presentacion 2); 3
# admite un margen de una dependencia y deja señalado a util, con Ce 4.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.util -> com.caso.presentacion: unas utilidades que dependen de
#     la capa de presentación invierten la dirección esperada y arrastran la
#     interfaz de usuario a todo el sistema.
#   - com.caso.util -> com.caso.negocio: util invade la capa de negocio; si
#     necesita lógica de servicio, es señal de responsabilidad mal ubicada.
#   - com.caso.util -> com.caso.persistencia: acoplamiento de utilidades al
#     acceso a datos, que las hace inservibles sin el motor de persistencia.
#   - com.caso.util -> com.caso.dominio: dependencia admisible de un núcleo
#     compartido, pero dentro de un paquete que ya concentra cuatro
#     dependencias salientes (Ce=4).

clasificacion.modo=cr+severidad
