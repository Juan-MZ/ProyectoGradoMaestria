# ============================================================================
# Catalogo de reglas de c4-combinado
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia
# presentacion: Adaptadores de entrada; solo coordinan casos de uso y no
# conocen detalles de persistencia.
capa.presentacion=com.caso.presentacion
# negocio: Casos de uso y reglas; orquestan el dominio y delegan el
# almacenamiento en persistencia.
capa.negocio=com.caso.negocio
# persistencia: Adaptador de salida hacia el almacenamiento; capa inferior, no
# debe conocer capas superiores.
capa.persistencia=com.caso.persistencia

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=persistencia
permitido.persistencia=

# Umbral de concentracion: Las capas estratificadas no superan Ce=3 y el
# núcleo de dominio tiene Ce=0; por encima de 3 dependencias salientes un
# paquete asume responsabilidades ajenas, y con este corte solo com.caso.util
# (Ce=4) queda señalado.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.persistencia -> com.caso.negocio: inversión de capas; el
#     repositorio no debe depender del servicio que lo invoca (además forma
#     ciclo negocio<->persistencia).
#   - com.caso.persistencia -> com.caso.presentacion: salto de dos capas hacia
#     arriba; el repositorio no tiene por qué conocer al controlador.
#   - com.caso.util -> com.caso.presentacion: una utilidad no debe depender de
#     la capa de entrada; si necesita orquestar, su sitio es negocio.
#   - com.caso.util -> com.caso.negocio: dependencia de una utilidad hacia el
#     caso de uso; apunta a lógica de negocio mal ubicada en util.
#   - com.caso.util -> com.caso.persistencia: dependencia de una utilidad
#     hacia el adaptador de salida, no prevista en la estratificación.

clasificacion.modo=cr+severidad
