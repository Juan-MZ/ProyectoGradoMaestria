# ============================================================================
# Catalogo de reglas de c2-ciclo
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,calculo,persistencia
# presentacion: Adaptadores de entrada que traducen peticiones externas y
# delegan en negocio.
capa.presentacion=com.caso.presentacion
# negocio: Servicios de caso de uso que orquestan cálculo, persistencia y
# entidades.
capa.negocio=com.caso.negocio
# calculo: Cálculo de totales, reutilizable y de nivel inferior: no debe
# conocer a los servicios que lo usan.
capa.calculo=com.caso.negocio.calculo
# persistencia: Acceso a datos; depende solo de las entidades del dominio.
capa.persistencia=com.caso.persistencia

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=calculo,persistencia
permitido.calculo=
permitido.persistencia=

# Umbral de concentracion: Los paquetes con rol acotado no pasan de Ce=2;
# negocio llega a 3 por orquestar tres colaboradores por diseño, y por encima
# de ahí el acoplamiento eferente indica responsabilidades acumuladas.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.negocio.calculo -> com.caso.negocio: cierra un ciclo con
#     negocio (FF2 crítica) e invierte la estratificación declarada (FF1); la
#     calculadora no debería depender del servicio.
#   - com.caso.presentacion -> com.caso.dominio: tolerada porque dominio queda
#     como núcleo compartido sin capa, pero vigile que no se convierta en vía
#     de acceso a datos.

clasificacion.modo=cr+severidad
