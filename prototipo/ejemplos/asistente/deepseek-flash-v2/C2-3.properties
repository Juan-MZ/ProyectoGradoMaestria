# ============================================================================
# Catalogo de reglas de c2-ciclo
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia
# presentacion: Punto de entrada que traduce peticiones y delega en negocio;
# solo debe conocer la fachada de servicios.
capa.presentacion=com.caso.presentacion
# negocio: Orquesta reglas y cálculo (incluye negocio.calculo como
# subpaquete); puede usar persistencia y entidades, no la presentación.
capa.negocio=com.caso.negocio
# persistencia: Detalle de almacenamiento de nivel inferior: depende solo del
# dominio, nunca de negocio ni presentación.
capa.persistencia=com.caso.persistencia

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=persistencia
permitido.persistencia=

# Umbral de concentracion: El mayor Ce observado es 3 (negocio, capa de
# orquestación) y el resto no pasa de 2; cualquier paquete que supere 3 habrá
# asumido responsabilidades ajenas.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.negocio.calculo -> com.caso.negocio: ciclo de dependencia entre
#     CalculadoraTotales y ServicioVenta; el cálculo debería recibir sus datos
#     por parámetro en vez de invocar al servicio.
#   - com.caso.negocio -> com.caso.persistencia: acoplamiento directo al
#     detalle de persistencia; si el diseño prevé repositorios como interfaz
#     en negocio, esta arista es deriva.

clasificacion.modo=cr+severidad
