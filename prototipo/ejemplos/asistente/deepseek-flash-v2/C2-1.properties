# ============================================================================
# Catalogo de reglas de c2-ciclo
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Punto de entrada al sistema: controladores que traducen la
# petición externa y delegan en negocio.
capa.presentacion=com.caso.presentacion
# negocio: Capa de casos de uso y cálculo; incluye su subpaquete calculo como
# colaborador interno, no como capa aparte.
capa.negocio=com.caso.negocio
# persistencia: Acceso a datos: solo debe conocer el modelo de dominio, nunca
# la presentación ni el negocio.
capa.persistencia=com.caso.persistencia
# dominio: Núcleo de entidades compartido por todas las capas; se declara
# inferior con lista vacía para garantizar que no dependa de nadie.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: Los paquetes de papel acotado tienen Ce 1-2 y
# negocio, que legítimamente orquesta persistencia y dominio, llega a 3; 5
# deja margen sin ocultar concentraciones anómalas.
umbral.concentracion=5

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.negocio.calculo -> com.caso.negocio: ciclo de paquetes (FF2);
#     la calculadora debería recibir los datos por parámetro en lugar de
#     depender del servicio que la invoca.
#   - com.caso.presentacion -> com.caso.dominio: permitido por ahora, pero si
#     la vista debe hablar solo con negocio, esta arista saltaría una capa y
#     debería retirarse del catálogo.

clasificacion.modo=cr+severidad
