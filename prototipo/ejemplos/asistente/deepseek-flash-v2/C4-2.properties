# ============================================================================
# Catalogo de reglas de c4-combinado
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Punto de entrada HTTP/UI que orquesta los servicios de
# negocio.
capa.presentacion=com.caso.presentacion
# negocio: Reglas de negocio; coordina persistencia y opera sobre entidades
# del dominio.
capa.negocio=com.caso.negocio
# persistencia: Acceso a datos; solo debe conocer el modelo de dominio que
# persiste.
capa.persistencia=com.caso.persistencia
# dominio: Entidades compartidas por todas las capas, sin dependencias
# salientes.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: Los paquetes de capa declaran a lo sumo 3
# dependencias salientes; solo util (Ce=4) lo excede y no tiene papel que lo
# justifique.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.persistencia -> com.caso.presentacion: la capa de datos depende
#     de la capa de entrada, inversión total de la estratificación.
#   - com.caso.persistencia -> com.caso.negocio: cierra un ciclo negocio <->
#     persistencia y obliga a cambiar ambas capas como una sola unidad.
#   - com.caso.util -> com.caso.presentacion: una clase de utilidades conoce
#     la capa más alta, lo que anula la dirección de dependencias.
#   - com.caso.util -> com.caso.negocio y com.caso.util ->
#     com.caso.persistencia: util concentra Ce=4 y acopla todo el sistema; es
#     el paquete con mayor riesgo de arrastre.

clasificacion.modo=cr+severidad
