# ============================================================================
# Catalogo de reglas de c4-combinado
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Capa de entrada: controladores que orquestan casos de uso y no
# deben ser invocados desde abajo.
capa.presentacion=com.caso.presentacion
# negocio: Servicios de caso de uso que coordinan persistencia y entidades del
# dominio.
capa.negocio=com.caso.negocio
# persistencia: Repositorios: acceden a almacenamiento y solo pueden apoyarse
# en el dominio.
capa.persistencia=com.caso.persistencia
# dominio: Núcleo de entidades sin dependencias salientes, del que dependen
# por diseño las capas superiores.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: Es el mayor Ce observado en paquetes con una única
# responsabilidad (dominio 0, presentacion 2, negocio 2, persistencia 3); un
# valor mayor dejaría de señalar paquetes que asumen dependencias de varias
# capas.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.persistencia -> com.caso.negocio: dependencia ascendente que
#     cierra un ciclo con negocio -> persistencia (FF2 crítica); la
#     persistencia no debe conocer los servicios que la usan.
#   - com.caso.persistencia -> com.caso.presentacion: inversión de capas; el
#     repositorio no tiene por qué referenciar controladores.
#   - com.caso.util -> com.caso.presentacion / negocio / persistencia /
#     dominio: paquete de utilidades que depende de las cuatro capas y que
#     nadie usa (Ca=0), con Ce=4 por encima del umbral; parece un contenedor
#     de responsabilidades ajenas.
#   - com.caso.presentacion -> com.caso.dominio: permitido por tratarse del
#     núcleo de entidades, pero conviene confirmar que el controlador no
#     manipula entidades saltándose el negocio.

clasificacion.modo=cr+severidad
