# ============================================================================
# Catalogo de reglas de c3-concentracion
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Adaptadores de entrada; única capa que puede invocar el caso
# de uso de negocio.
capa.presentacion=com.caso.presentacion
# negocio: Servicios de caso de uso que orquestan persistencia y reglas sobre
# el dominio.
capa.negocio=com.caso.negocio
# persistencia: Acceso a datos; solo conoce entidades de dominio, nunca capas
# superiores.
capa.persistencia=com.caso.persistencia
# dominio: Núcleo de entidades compartido por todas las capas, declarado como
# capa inferior sin dependencias salientes.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: Los paquetes sanos no superan Ce=2 (negocio y
# presentacion); 3 deja un margen de uno sin ocultar el Ce=4 de com.caso.util.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.util -> com.caso.presentacion: un paquete de utilidades no debe
#     depender de la capa de entrada; invierte la estratificación.
#   - com.caso.util -> com.caso.negocio: acopla utilidades al caso de uso,
#     impidiendo reutilizarlas o probarlas aisladas.
#   - com.caso.util -> com.caso.persistencia: utilidades conocen detalles de
#     acceso a datos, responsabilidad que no les corresponde.
#   - com.caso.util (Ce=4): concentra dependencias hacia las cuatro capas;
#     parece un cajón de sastre que asumió responsabilidades ajenas.

clasificacion.modo=cr+severidad
