# ============================================================================
# Catalogo de reglas de c3-concentracion
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Adaptadores de entrada (controladores) que traducen peticiones
# al caso de uso.
capa.presentacion=com.caso.presentacion
# negocio: Servicios que orquestan reglas de negocio sobre el dominio y la
# persistencia.
capa.negocio=com.caso.negocio
# persistencia: Acceso a datos: repositorios que materializan entidades del
# dominio.
capa.persistencia=com.caso.persistencia
# dominio: Núcleo estable (Ce=0, Ca=4): entidades sin dependencias salientes.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: La distribución de Ce es 0,2,1,2,4: con 3 las capas
# declaradas (Ce<=2) quedan holgadas y solo se señala com.caso.util (Ce=4),
# que es precisamente el paquete anómalo.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.util -> com.caso.presentacion: un paquete de utilidades depende
#     de la capa más alta, invirtiendo la dirección esperada (las utilidades
#     deberían ser dependidas, no depender).
#   - com.caso.util -> com.caso.negocio: misma inversión; el servicio de
#     negocio no debería ser insumo de utilidades.
#   - com.caso.util -> com.caso.persistencia: mezcla utilidades con detalles
#     de acceso a datos.
#   - com.caso.util -> com.caso.dominio: dependencia tolerable en sí, pero
#     junto a las tres anteriores confirma Ce=4 y una responsabilidad
#     sobredimensionada.

clasificacion.modo=cr+severidad
