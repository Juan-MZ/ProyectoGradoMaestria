# ============================================================================
# Catalogo de reglas de c3-concentracion
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Adaptador de entrada: traduce peticiones y delega en negocio,
# sin conocer el almacenamiento.
capa.presentacion=com.caso.presentacion
# negocio: Concentra las reglas de venta y coordina el acceso a datos a través
# de persistencia.
capa.negocio=com.caso.negocio
# persistencia: Aísla el acceso al almacenamiento y devuelve entidades del
# dominio.
capa.persistencia=com.caso.persistencia
# dominio: Modelo de negocio puro, sin dependencias salientes, que sirve de
# base a la estratificación.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: Los paquetes estratificados tienen Ce entre 0 y 2;
# 3 tolera una dependencia adicional sin ocultar el paquete de utilidades, que
# con Ce=4 queda señalado.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.presentacion -> com.caso.dominio: salta la capa de negocio; si
#     el controlador usa entidades de dominio directamente, la lógica de
#     transformación se dispersa fuera de negocio.
#   - com.caso.util -> com.caso.presentacion, com.caso.negocio,
#     com.caso.persistencia, com.caso.dominio: paquete de utilidades con Ce=4
#     y Ca=0 que depende de las cuatro capas; no es un hub compartido legítimo
#     (nadie tira de él), sino un cajón de sastre que acopla todo el sistema.
#   - com.caso.util -> com.caso.presentacion: dependencia ascendente desde un
#     paquete de apoyo hacia el adaptador de entrada, la más difícil de
#     justificar de las cuatro.

clasificacion.modo=cr+severidad
