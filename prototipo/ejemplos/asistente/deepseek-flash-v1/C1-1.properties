# ============================================================================
# Catalogo de reglas de c1-capas
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Capa de entrada que orquesta casos de uso; puede usar negocio
# y, si se confirma, el modelo de dominio, pero no persistencia.
capa.presentacion=com.caso.presentacion
# negocio: Contiene servicios de caso de uso y coordina la persistencia con el
# modelo de dominio.
capa.negocio=com.caso.negocio
# persistencia: Implementa el acceso a datos y depende únicamente del modelo
# de dominio.
capa.persistencia=com.caso.persistencia
# dominio: Modelo y reglas centrales; no debe depender de capas externas.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: La distribución de Ce es 0, 1, 2 y 3; 2 es el
# máximo esperado para presentación usando negocio y dominio, y el 3 actual
# delata la dependencia directa de persistencia.
umbral.concentracion=2

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.presentacion -> com.caso.persistencia: ControladorVenta usa
#     RepositorioVenta directamente, saltando la capa de negocio; no debería
#     permitirse y la llamada debería pasar por ServicioVenta.

clasificacion.modo=cr+severidad
