# ============================================================================
# Catalogo de reglas de c2-ciclo
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Punto de entrada al sistema; solo debe hablar con la fachada
# de negocio.
capa.presentacion=com.caso.presentacion
# negocio: Servicios de caso de uso y sus cálculos internos, que se mantienen
# en la misma capa para no fragmentar una única responsabilidad de negocio.
capa.negocio=com.caso.negocio,com.caso.negocio.calculo
# persistencia: Acceso a datos: implementa la recuperación y almacenamiento
# que negocio necesita.
capa.persistencia=com.caso.persistencia
# dominio: Modelo de entidades, capa más baja: no debe depender de ninguna
# otra.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: El mayor Ce observado es 3 (negocio, con sus tres
# colaboradores naturales); 4 deja un solo margen antes de señalar un paquete
# que acapare el sistema.
umbral.concentracion=4

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.negocio.calculo -> com.caso.negocio: ciclo con com.caso.negocio
#     -> com.caso.negocio.calculo (FF2 crítica); el cálculo debería recibir
#     los datos por parámetro y depender solo de dominio.
#   - com.caso.presentacion -> com.caso.dominio: salta la capa negocio; el
#     controlador debería consumir solo lo que expone negocio, o el equipo
#     debe declarar dominio como vocabulario compartido.

clasificacion.modo=cr+severidad
