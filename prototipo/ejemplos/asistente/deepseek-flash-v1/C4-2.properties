# ============================================================================
# Catalogo de reglas de c4-combinado
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Capa de entrada: adapta peticiones externas y delega en
# negocio; ControladorVenta es su única clase.
capa.presentacion=com.caso.presentacion
# negocio: Capa de casos de uso: orquesta dominio y persistencia;
# ServicioVenta concentra la lógica de venta.
capa.negocio=com.caso.negocio
# persistencia: Capa de acceso a datos: solo debe conocer el modelo de
# dominio, nunca negocio ni presentacion.
capa.persistencia=com.caso.persistencia
# dominio: Modelo del negocio sin dependencias salientes (Ce=0), base de la
# estratificación.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: El máximo Ce entre las capas declaradas es 3
# (persistencia), así que 3 es el acoplamiento eferente que la estratificación
# prevista justifica; cualquier paquete por encima asumió responsabilidades
# ajenas.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.persistencia -> com.caso.negocio: inversión de capas que además
#     cierra un ciclo negocio<->persistencia (FF2).
#   - com.caso.persistencia -> com.caso.presentacion: la capa más baja depende
#     de la más alta, saltándose negocio y dominio (FF1) y alimentando el
#     ciclo persistencia->presentacion->negocio->persistencia (FF2).
#   - com.caso.util -> com.caso.presentacion (y -> negocio, persistencia,
#     dominio): paquete transversal que depende de todas las capas; con Ce=4
#     supera el umbral 3 (FF3) y deja de ser reutilizable.

clasificacion.modo=cr+severidad
