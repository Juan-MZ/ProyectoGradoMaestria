# ============================================================================
# Catalogo de reglas de c4-combinado
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Punto de entrada de la aplicación; adapta peticiones y delega
# en negocio.
capa.presentacion=com.caso.presentacion
# negocio: Reglas de venta; orquesta persistencia y opera sobre el dominio.
capa.negocio=com.caso.negocio
# persistencia: Almacenamiento de las entidades de dominio; no debe conocer
# capas superiores.
capa.persistencia=com.caso.persistencia
# dominio: Modelo de entidades sin dependencias salientes; base estable de la
# pila.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: Los Ce del perfil son {0,2,2,3,4}: las capas
# estratificadas no pasan de 3 y solo util (4) excede el umbral, que es lo que
# se quiere señalar.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.persistencia -> com.caso.negocio: inversión de capas que además
#     cierra un ciclo negocio<->persistencia; la persistencia no debería
#     invocar reglas de negocio.
#   - com.caso.persistencia -> com.caso.presentacion: salto hacia arriba; el
#     repositorio conoce la capa de entrada, lo que acopla el almacenamiento a
#     la interfaz.
#   - com.caso.util -> com.caso.presentacion y com.caso.util ->
#     com.caso.persistencia: un paquete de utilidades no debería depender de
#     la entrada ni del almacenamiento; probable clase mal ubicada.
#   - com.caso.util -> com.caso.negocio: refuerza el acoplamiento de util con
#     toda la pila; con Ce=4 queda además por encima del umbral de
#     concentración.

clasificacion.modo=cr+severidad
