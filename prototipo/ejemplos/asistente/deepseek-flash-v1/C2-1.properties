# ============================================================================
# Catalogo de reglas de c2-ciclo
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Capa de entrada: traduce peticiones y delega, sin lógica de
# negocio ni acceso a datos.
capa.presentacion=com.caso.presentacion
# negocio: Orquesta casos de uso; incluye negocio.calculo por herencia de
# prefijo al no existir intención declarada de aislarlo.
capa.negocio=com.caso.negocio
# persistencia: Único punto de acceso al almacenamiento, consumido solo desde
# negocio.
capa.persistencia=com.caso.persistencia
# dominio: Modelo de entidades sin dependencias salientes (Ce=0), usado como
# vocabulario compartido por las capas superiores.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: El máximo observado es Ce=3 (negocio, la capa que
# orquesta) y el techo teórico con 5 paquetes es 4: fijarlo en 4 solo señala a
# un paquete que termine dependiendo de todos los demás, sin el ruido del
# valor por defecto 10, inalcanzable en este proyecto.
umbral.concentracion=4

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.negocio.calculo -> com.caso.negocio (3): ciclo negocio <->
#     negocio.calculo; la calculadora de totales no debería conocer al
#     servicio que la invoca, la relación correcta es unidireccional negocio
#     -> calculo (recibir los datos por parámetro).
#   - com.caso.presentacion -> com.caso.dominio (1): se permite por tratarse
#     del modelo compartido, pero si la intención es que la vista solo
#     dialogue con negocio, es una fuga de la capa de presentación hacia el
#     modelo.

clasificacion.modo=cr+severidad
