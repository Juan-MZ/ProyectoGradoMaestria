# ============================================================================
# Catalogo de reglas de c2-ciclo
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: ControladorVenta es el único paquete sin dependencias
# entrantes (Ca=0) y solo coordina negocio con el modelo.
capa.presentacion=com.caso.presentacion
# negocio: ServicioVenta orquesta persistencia, cálculo y dominio, y
# CalculadoraTotales se declara como detalle interno del negocio, no como capa
# propia.
capa.negocio=com.caso.negocio,com.caso.negocio.calculo
# persistencia: RepositorioVenta solo necesita el dominio para materializar
# entidades y no debe conocer negocio ni presentación.
capa.persistencia=com.caso.persistencia
# dominio: Cliente y Venta no tienen dependencias salientes (Ce=0) y son la
# base de la que dependen las demás capas.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: El máximo observado es Ce=3 en negocio, que ya
# coordina tres paquetes; fijar 4 deja un margen de una dependencia antes de
# señalar un paquete que asumió responsabilidades de más.
umbral.concentracion=4

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.negocio.calculo -> com.caso.negocio: cierra un ciclo con
#     negocio (FF2 crítica); el cálculo debería recibir los datos que necesita
#     por parámetro en lugar de consultar al servicio.
#   - com.caso.negocio -> com.caso.negocio.calculo: en sí es correcto, pero
#     combinado con la arista inversa forma la unidad de cambio implícita que
#     hay que romper.

clasificacion.modo=cr+severidad
