# ============================================================================
# Catalogo de reglas de c0-base
# Propuesto con el asistente de Arquitecta (deepseek-flash) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Capa de entrada: el controlador expone casos de uso y no debe
# conocer detalles de persistencia ni saltarse la lógica de negocio.
capa.presentacion=com.caso.presentacion
# negocio: Capa de servicios: orquesta los casos de uso combinando reglas de
# dominio y repositorios.
capa.negocio=com.caso.negocio
# persistencia: Capa de acceso a datos: implementa el almacenamiento de las
# entidades del dominio y no conoce capas superiores.
capa.persistencia=com.caso.persistencia
# dominio: Núcleo del modelo (Cliente, Venta): no depende de ninguna otra capa
# del sistema.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: Con cuatro paquetes el máximo de dependencias
# salientes es tres, de modo que 2 deja margen para el crecimiento normal y
# solo señala al paquete que acapare casi todo el resto del sistema.
umbral.concentracion=2

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.presentacion -> com.caso.dominio: el controlador referencia
#     entidades del dominio saltando la capa de negocio; si no son tipos de
#     transporte deliberados, negocio debería exponerlos.

clasificacion.modo=cr+severidad
