# ============================================================================
# Catalogo de reglas de c4-combinado
# Propuesto con el asistente de Arquitecta (deepseek-v4-pro) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio,utilidades
# presentacion: Interfaz de usuario y controladores; capa superior que inicia
# las operaciones.
capa.presentacion=com.caso.presentacion
# negocio: Lógica de aplicación y casos de uso.
capa.negocio=com.caso.negocio
# persistencia: Acceso a datos y repositorios.
capa.persistencia=com.caso.persistencia
# dominio: Entidades de negocio compartidas por las capas superiores.
capa.dominio=com.caso.dominio
# utilidades: Utilidades transversales; como capa base no debe depender de
# otras capas.
capa.utilidades=com.caso.util

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=
permitido.utilidades=

# Umbral de concentracion: El mayor Ce observado es 4 (util) y los paquetes
# acotados tienen Ce 3; 6 deja margen razonable sin ocultar concentraciones.
umbral.concentracion=6

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.persistencia -> com.caso.negocio: la persistencia no debe
#     depender de negocio; forma un ciclo negocio-persistencia.
#   - com.caso.persistencia -> com.caso.presentacion: la persistencia no debe
#     depender de presentación.
#   - com.caso.util -> com.caso.presentacion: una utilidad base no debe
#     depender de la presentación.
#   - com.caso.util -> com.caso.negocio: una utilidad base no debe depender de
#     negocio.
#   - com.caso.util -> com.caso.persistencia: una utilidad base no debe
#     depender de persistencia.
#   - com.caso.util -> com.caso.dominio: una utilidad base no debería depender
#     del dominio, salvo que se confirme que son utilidades de dominio.

clasificacion.modo=cr+severidad
