# ============================================================================
# Catalogo de reglas de c3-concentracion
# Propuesto con el asistente de Arquitecta (deepseek-v4-pro) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: Controladores de la interfaz; capa más alta que depende de
# negocio y dominio.
capa.presentacion=com.caso.presentacion
# negocio: Servicio de aplicación con reglas de negocio.
capa.negocio=com.caso.negocio
# persistencia: Acceso a datos y repositorios.
capa.persistencia=com.caso.persistencia
# dominio: Entidades del dominio usadas por las capas superiores; núcleo
# independiente.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio,dominio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: Los paquetes de aplicación sanos no superan Ce=2;
# se fija en 2 para detectar el acoplamiento de com.caso.util, que tiene Ce=4.
umbral.concentracion=2

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.util -> com.caso.presentacion: una utilidad no debería depender
#     de la presentación; probable código de UI mal ubicado.
#   - com.caso.util -> com.caso.negocio: una utilidad no debería depender de
#     negocio; probable lógica de servicio mal ubicada.
#   - com.caso.util -> com.caso.persistencia: una utilidad no debería depender
#     de persistencia; probable acceso a datos mal ubicado.

clasificacion.modo=cr+severidad
