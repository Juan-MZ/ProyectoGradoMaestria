# ============================================================================
# Catalogo de reglas de c4-combinado
# Propuesto con el asistente de Arquitecta (deepseek-v4-pro) el 2026-10-19.
# Revise cada decision antes de adoptarlo: el catalogo debe declarar la
# arquitectura PREVISTA del sistema, no la que el codigo tiene hoy.
# ============================================================================

raiz=com.caso

# Capas, de la mas alta a la mas baja. Cada una agrupa prefijos de paquete;
# los subpaquetes heredan la capa.
capas=presentacion,negocio,persistencia,dominio
# presentacion: ControladorVenta, expone casos de uso y depende de negocio.
capa.presentacion=com.caso.presentacion
# negocio: ServicioVenta, lógica de aplicación; depende de persistencia y
# dominio.
capa.negocio=com.caso.negocio
# persistencia: RepositorioVenta, acceso a datos; depende solo de dominio.
capa.persistencia=com.caso.persistencia
# dominio: Entidades Cliente y Venta, núcleo de dominio; no depende de otras
# capas.
capa.dominio=com.caso.dominio

# Dependencias permitidas entre capas (dentro de una misma capa siempre se
# permiten).
permitido.presentacion=negocio
permitido.negocio=persistencia,dominio
permitido.persistencia=dominio
permitido.dominio=

# Umbral de concentracion: presentacion, negocio y persistencia tienen Ce
# entre 2 y 3; util con Ce=4 concentra más acoplamiento saliente que el resto.
umbral.concentracion=3

# Dependencias actuales que este catalogo NO permite y que el asistente
# considera probable deriva (apareceran como hallazgos):
#   - com.caso.persistencia -> com.caso.negocio: inversión de capas y ciclo
#     con negocio; persistencia no debe depender de negocio.
#   - com.caso.persistencia -> com.caso.presentacion: inversión de capas;
#     persistencia no debe depender de presentación.
#   - com.caso.presentacion -> com.caso.dominio: salto de capa si no se
#     permite acceso directo a entidades.
#   - com.caso.util -> com.caso.negocio, com.caso.persistencia,
#     com.caso.presentacion: util acoplado a capas superiores; quedará
#     señalado por concentración.

clasificacion.modo=cr+severidad
