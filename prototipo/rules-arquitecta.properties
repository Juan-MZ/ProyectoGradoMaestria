# ============================================================================
#  Configuracion para el analisis del propio mecanismo (dogfooding)
#  ---------------------------------------------------------------
#  Aplicar Arquitecta sobre Arquitecta permite verificar que la arquitectura
#  interna del prototipo satisface las mismas reglas que exige a los sistemas
#  que evalua. Es una comprobacion de consistencia, no parte del experimento
#  controlado.
#
#  NOTA sobre el orden de declaracion: la asignacion de paquetes a capas se
#  resuelve por prefijo y en el orden en que las capas aparecen en 'capas'. Como
#  la raiz de composicion es prefijo de todas las demas, debe declararse ultima
#  para que las capas mas especificas se evaluen primero.
# ============================================================================

raiz=co.javeriana.msw.arquitecta

capas=configuracion,extraccion,reglas,motor,reporte,servicio,interfaz,aplicacion
capa.configuracion=co.javeriana.msw.arquitecta.config
capa.extraccion=co.javeriana.msw.arquitecta.grafo
capa.reglas=co.javeriana.msw.arquitecta.reglas
capa.motor=co.javeriana.msw.arquitecta.motor
capa.reporte=co.javeriana.msw.arquitecta.reporte
capa.servicio=co.javeriana.msw.arquitecta.servicio
capa.interfaz=co.javeriana.msw.arquitecta.interfaz
capa.aplicacion=co.javeriana.msw.arquitecta

# La dependencia fluye en un unico sentido: de la aplicacion hacia la interfaz
# grafica y el servicio de analisis, de estos hacia el reporte, del reporte hacia
# el motor, del motor hacia las reglas y de las reglas hacia los dos modulos base
# (extraccion y configuracion), que no dependen de nadie.
#
# La interfaz grafica solo presenta: no lee la configuracion ni construye el
# grafo, sino que pide el analisis al servicio y dibuja su resultado. Por eso se
# le niega el acceso directo a los modulos base; si algun dia los necesitara,
# la regla lo senalaria como deriva.
permitido.aplicacion=interfaz,servicio,reporte,motor,reglas,extraccion,configuracion
permitido.interfaz=servicio,reporte,motor,reglas
permitido.servicio=reporte,motor,reglas,extraccion,configuracion
permitido.reporte=motor,reglas,extraccion,configuracion
permitido.motor=reglas,extraccion,configuracion
permitido.reglas=extraccion,configuracion
permitido.extraccion=
permitido.configuracion=

# La raiz de composicion conoce, por definicion, a todos los modulos que
# ensambla: su acoplamiento eferente elevado es una consecuencia del patron y no
# una deriva. Lo mismo ocurre con el servicio de analisis, que es la fachada que
# encadena el pipeline completo (configuracion, extraccion, reglas, motor y
# reporte) para que la linea de comandos y la interfaz grafica lo compartan sin
# duplicarlo. En lugar de relajar el umbral para todo el sistema ---que ocultaria
# concentraciones reales en los demas paquetes--- se declara el papel de ambos de
# forma explicita. La exencion queda registrada en el reporte.
rol.compartido=co.javeriana.msw.arquitecta,co.javeriana.msw.arquitecta.servicio

# Umbral calibrado para este sistema. Con la raiz y el servicio exentos ya no
# hace falta subirlo a 5 para acomodarlos, pero si dejarlo en 4: el modulo de
# reporte depende de los cuatro que debe representar (motor, reglas, grafo y
# configuracion), la interfaz de los cuatro cuyo resultado presenta (servicio,
# reporte, motor y reglas), y esa es la consecuencia de su cometido, no una
# concentracion sobrevenida. Fijarlo en 3 los senala; el caso ilustra que el umbral no es universal y que cada sistema
# obliga a decidir donde esta su techo razonable.
umbral.concentracion=4

umbral.cr.aceptable=85
umbral.cr.observacion=70
clasificacion.modo=cr+severidad
